packages:
  - packages/*

catalogMode: strict

catalog:
  "@abereghici/tokens": 0.2.0
  "@types/mustache": 4.2.6
  "@types/node": 26.6.5
  "@types/opentype.js": 1.3.10
  "@vscode/vsce": 4.1.0
  colorjs.io: 0.5.2
  fast-xml-parser: 5.11.2
  mustache: 4.2.0
  opentype.js: 2.0.0
  oxfmt: 0.74.0
  oxlint: 1.89.0
  smol-toml: 1.9.1
  style-dictionary: 5.7.0
  typescript: 7.0.2
  vitest: 5.0.5
  yaml: 2.9.1

# vsce-sign's postinstall only matters for signed Marketplace publishing; packaging doesn't need it.
allowBuilds:
  "@vscode/vsce-sign": false

# The design system is released by the same maintainer, so its new versions apply at once
minimumReleaseAgeExclude:
  - "@abereghici/tokens"
