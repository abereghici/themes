name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
          cache: true
      # bat, delta, eza, fzf, jq, Neovim, ripgrep, Starship and StyLua, at mise.lock's versions and checksums
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      # zsh syntax-checks the zsh ports
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh
      # tmux publishes no binaries; 3.8 is the first with the `theme` option the port uses
      - name: Build tmux
        env:
          TMUX_VERSION: "3.8"
          TMUX_SHA256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
        run: |
          sudo apt-get install --yes --no-install-recommends bison libevent-dev libncurses-dev pkg-config
          curl --fail --location --silent --show-error --output tmux.tar.gz \
            "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  tmux.tar.gz" | sha256sum --check
          tar --extract --gzip --file tmux.tar.gz
          (cd "tmux-$TMUX_VERSION" && ./configure --prefix="$RUNNER_TEMP/tmux" && make --jobs="$(nproc)" && make install)
          echo "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm check-types
      - run: pnpm test
      # The generated themes are committed: fail when a template or token changed without `pnpm build`
      - run: pnpm check
