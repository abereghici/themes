version: 2
updates:
  # Keeps the SHA-pinned actions current; the repository requires full-SHA pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Proposes each new @abereghici/tokens, so a design system change reaches the themes as a reviewed diff.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@abereghici/tokens"
